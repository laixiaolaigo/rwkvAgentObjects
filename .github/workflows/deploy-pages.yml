name: Deploy Next.js site to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    # Daily probe; maintenance runs only after five UTC calendar days.
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.schedule.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check five-day maintenance interval
        id: schedule
        run: node scripts/rwkv-discovery-schedule.mjs

  build:
    needs: cadence
    if: github.event_name != 'schedule' || needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run update:metadata

      - name: Scan GitHub for RWKV repositories
        if: needs.cadence.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run discover:rwkv

      - name: Review and add new RWKV Agents
        if: needs.cadence.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_REVIEW_API_KEY: ${{ secrets.AGENT_REVIEW_API_KEY }}
          AGENT_REVIEW_MODEL: ${{ vars.AGENT_REVIEW_MODEL }}
          AGENT_REVIEW_BASE_URL: ${{ vars.AGENT_REVIEW_BASE_URL }}
          AGENT_REVIEW_MAX_CANDIDATES: ${{ vars.AGENT_REVIEW_MAX_CANDIDATES }}
        run: npm run review:agents

      - name: Upload RWKV candidates and review report
        if: always() && needs.cadence.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rwkv-search-candidates
          path: |
            rwkv_search_candidates.json
            rwkv_agent_review_report.json
          retention-days: 30

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Validate maintenance scripts
        run: npm run test:maintenance

      - name: Lint
        run: npm run lint

      - name: Build static site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Record completed discovery
        if: needs.cadence.outputs.due == 'true'
        run: node scripts/rwkv-discovery-schedule.mjs --complete

      - name: Commit validated catalogue and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent.json agent_repo.json rwkv_projects.json agent_repository_review.json .github/rwkv-discovery-state.json
          if git diff --cached --quiet; then
            echo "No catalogue or metadata changes to commit"
          else
            git commit -m "chore: refresh RWKV catalogue and discovery state"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
